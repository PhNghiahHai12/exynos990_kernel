name: Build PNHKRNL

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag Name'
        required: true
        default: 'v1.0.2-susfs'

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [c2s, c2slte, c1s, c1slte, z3s, y2s, y2slte, x1s, x1slte, r8s]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential pcre2-utils
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt clean

      - name: Setup SuSFS & Kernel Name (NHKRNL)
        run: |
          # 1. Đặt tên hiển thị trong Cài đặt phần mềm là -NHKRNL
          echo "Setting LOCALVERSION to -NHKRNL..."
          find arch/arm64/configs/ -type f -name "*defconfig" -exec sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-NHKRNL"/' {} +

          # 2. Spoof phiên bản SuSFS
          if [ -f "include/linux/susfs.h" ]; then
            echo "Spoofing SUSFS_VERSION to v2.2.0..."
            sed -i 's/#define SUSFS_VERSION.*/#define SUSFS_VERSION "v2.2.0"/g' include/linux/susfs.h
          fi

          # 3. Đảm bảo susfs.c được Kbuild gọi biên dịch qua susfs.o
          if [ -f "fs/Makefile" ]; then
            if ! grep -q "susfs.o" fs/Makefile; then
              echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
              echo "Added susfs.o to fs/Makefile"
            fi
          fi

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build kernel (${{ matrix.target }})
        run: |
          # Gọi biên dịch kernel kèm KernelSU (-k y)
          ./build.sh -m ${{ matrix.target }} -k y -r n

      - name: Upload artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: PNHKRNL-${{ matrix.target }}
          path: build/out/${{ matrix.target }}/*.zip

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Retrieve artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw_artifacts

      - name: Prepare release files
        run: |
          mkdir -p final_artifacts
          find raw_artifacts/ -name "*.zip" -exec cp {} final_artifacts/ \;

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag }}
          name: "Release: ${{ github.event.inputs.tag }}"
          draft: false
          prerelease: false
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "final_artifacts/*.zip"
          body: |
            ## PNHKRNL Official Build
            * **Release Tag:** `${{ github.event.inputs.tag }}`
            * **Kernel Identifier:** `NHKRNL`
            * **Features:** KernelSU-Next + SuSFS v2.2.0
            * **Target Devices:** Exynos 990 (S20 / Note 20 / S20 FE)
